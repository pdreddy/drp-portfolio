  .pill { display: inline-flex; align-items: center; gap: 10px; padding: 10px 18px; border: 1px solid #2f3a52; border-radius: 999px; background: rgba(18,24,38,.8); color: #95a1b6; font: 500 18px/1 'Liberation Sans', sans-serif; }

  .bottom { display: flex; justify-content: space-between; align-items: flex-end; }
  .chips { display: flex; gap: 12px; }
  .chip { padding: 10px 16px; border: 1px solid #2f3a52; border-radius: 10px; background: #121826; color: #e6ebf4; font: 600 19px/1 'Liberation Sans', sans-serif; }
  .domain { color: #95a1b6; font: 500 22px/1 'DejaVu Sans Mono', monospace; }
